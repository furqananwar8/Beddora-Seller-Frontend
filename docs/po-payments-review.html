<title>PO Payments Review</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1a1d23;--mut:#6b7280;--line:#e5e7eb;--warn:#b45309;--warnbg:#fef3c7;--ok:#047857;--okbg:#d1fae5;--po:#eef2ff;--inv:#fdf2f8}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
h1{margin:0 0 8px;font-size:18px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input[type=search]{min-width:260px;flex:1}button{cursor:pointer}
.sum{color:var(--mut);font-size:13px;margin-top:6px}
main{max-width:1250px;margin:0 auto;padding:16px}
.po{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;cursor:pointer}
.ph b{font-size:15px}.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--po)}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}
.tot{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.body{display:none;padding:0 14px 14px;overflow-x:auto}.po.open .body{display:block}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:12px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ct{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:8px 10px;background:var(--card)}.ct h4{margin:0 0 6px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}.sub{background:var(--po);font-weight:600}.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin:6px 0}.kv div span{display:block;color:var(--mut);font-size:11px;text-transform:uppercase}.neg{color:var(--warn);font-weight:600}.tag.bad{background:var(--warnbg);color:var(--warn)}#list>table{background:var(--card)}
.mut{color:var(--mut)}.empty{color:var(--mut);padding:6px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;overflow-x:auto}
</style></head><body>

const $=s=>document.querySelector(s),f=n=>n==null||n===''?'':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=m=>Object.entries(m).map(([c,v])=>f(v)+' '+c).join(' + ')||'—';
const kv=a=>'<div class="kv">'+a.map(x=>'<div><span>'+x[0]+'</span>'+(x[2]?'<b class="neg">':'<b>')+x[1]+'</b></div>').join('')+'</div>';
[...new Set(D.pos.map(p=>p.supplier))].sort().forEach(s=>$('#fs').insertAdjacentHTML('beforeend','<option>'+esc(s)+'</option>'));
const hasI=p=>p.pls.some(l=>l.inv.length),hasP=p=>p.pls.some(l=>l.paid.length);
D.pos.forEach(p=>{p.h=(p.po+' '+p.supplier+' '+p.pls.map(l=>l.c+' '+l.inv.map(g=>g.vendor+' '+g.invoice+' '+g.lines.map(x=>x.expense).join(' ')).join(' ')+' '+l.paid.map(x=>x.vendor).join(' ')).join(' ')).toLowerCase()});
function ct(l){
const inv=l.inv.length?'<table><tr><th>Invoice #</th><th>Date</th><th>Vendor</th><th>Expense</th><th class="n">Amount</th></tr>'+l.inv.map(g=>g.lines.map((x,i)=>'<tr><td>'+(i?'':esc(g.invoice))+'</td><td>'+(i?'':g.date)+'</td><td>'+(i?'':esc(g.vendor))+'</td><td>'+esc(x.expense)+'</td><td class="n">'+f(x.amount)+' '+g.cur+'</td></tr>').join('')+'<tr class="sub"><td colspan="4">Invoice '+esc(g.invoice)+' total</td><td class="n">'+f(g.total)+' '+g.cur+'</td></tr>').join('')+'</table>':'<div class="empty">No expense invoices.</div>';
const pay=l.paid.length?'<table><tr><th>Date</th><th>Paid to</th><th class="n">Amount paid</th></tr>'+l.paid.map(x=>'<tr><td>'+x.date+'</td><td>'+esc(x.vendor)+'</td><td class="n">'+f(x.amount)+' '+x.cur+'</td></tr>').join('')+'</table>':'<div class="empty">No expense payment recorded.</div>';
const c=l.cp;
return '<div class="ct"><h4>'+l.c+'<span class="tag">'+esc(l.status)+'</span><span class="mut">'+l.cartons+' cartons · '+l.cbm+' CBM</span>'+(l.shared.length?'<span class="tag w">shared with '+l.shared.length+': '+esc(l.shared.join(', '))+'</span>':'')+'</h4>'
+(c?kv([['Goods value (USD)',f(c.goods)],['Balance portion',f(c.balPortion)],['Balance paid',f(c.paid)],['Remaining',f(c.rem),c.rem<-0.005],['Tracker action',esc(c.action)]]):'<div class="empty">Not in Container Payments tab.</div>')
+'<div class="two"><div><h3>Expense invoices (A–G) · '+cur(l.ti)+'</h3>'+inv+'</div><div><h3>Expense payments made (J–N) · '+cur(l.tp)+'</h3>'+pay+(l.rate?'<div class="mut" style="margin-top:6px">Implied rate: '+l.rate+' CAD per USD</div>':'')+'</div></div></div>'}
function card(p){
const ok=p.audit=='ok';
return '<div class="po"><div class="ph"><b>'+p.po+'</b><span>'+esc(p.supplier)+'</span><span class="tag">'+esc(p.dest)+'</span><span class="tag">'+esc(p.status)+'</span>'+(p.notInSql?'<span class="tag w">not in your SQL</span>':'')+'<span class="tag '+(ok?'ok':'bad')+'">container audit '+(ok?'OK':'DIFF')+'</span><span class="tot">PO '+f(p.value)+' · Paid '+f(p.totPaid)+'<div class="'+(p.totRem<-0.005?'neg':'mut')+'" style="font-size:12px">Remaining '+f(p.totRem)+' USD · '+esc(p.pstatus)+'</div></span></div><div class="body">'
+'<h3>PO payments (PO Payments tab, USD)</h3>'+kv([['PO value',f(p.value)],['Deposit %',(p.depPct*100).toFixed(1)+'%'],['Deposit scheduled',f(p.depSched)],['Deposit paid',f(p.depPaid)],['Deposit approved, not paid',f(p.depApproved)],['Balance',f(p.balance)],['Balance paid',f(p.balPaid)],['Other paid',f(p.otherPaid)],['Balance remaining',f(p.balRem),p.balRem<-0.005],['Total paid',f(p.totPaid)],['Total remaining',f(p.totRem),p.totRem<-0.005],['Value in containers',f(p.valInCont)],['Not in a container',f(p.notInCont)]])
+(p.remarks?'<div class="mut">Tracker remark: '+esc(p.remarks)+'</div>':'')
+'<h3>Audit vs Container Payments tab</h3><table><tr><th></th><th class="n">PO Payments tab</th><th class="n">Sum of containers</th><th class="n">Difference</th></tr><tr><td>Balance paid</td><td class="n">'+f(p.balPaid)+'</td><td class="n">'+f(p.cpPaid)+'</td><td class="n '+(Math.abs(p.diffPaid)>=0.02?'neg':'')+'">'+f(p.diffPaid)+'</td></tr><tr><td>Value in containers</td><td class="n">'+f(p.valInCont)+'</td><td class="n">'+f(p.cpGoods)+'</td><td class="n '+(Math.abs(p.diffVal)>=0.02?'neg':'')+'">'+f(p.diffVal)+'</td></tr></table>'
+(p.pls.length?'<h3>Containers</h3>'+p.pls.map(ct).join(''):'<div class="empty" style="margin-top:8px">No packaging list / container yet.</div>')+'</div></div>'}
const HOW={po:'<b>By PO:</b> PO payments from the PO Payments tab, audited against the Container Payments tab, plus each container expense invoices (Sheet2 A–G) and expense payments made (J–N).',req:'<b>PO payment requests:</b> one request per PO, <i>Paying against: Purchase order</i>, for the full amount paid per the PO Payments tab (deposit + balance + other). No purchase invoice is created.',exp:'<b>Expense payment requests:</b> one request per sheet invoice, <i>Paying against: Invoice</i> with the invoice no. typed in, the invoice date, the container and destination, and one amount line per expense. No purchase invoice and no PO. The payment made (J–N) for the container is shown for reference.'};
function reqView(){const rows=D.pos.filter(p=>p.totPaid>0).filter(p=>match(p));const tot=rows.reduce((s,p)=>s+p.totPaid,0);
return '<table><tr><th>PO</th><th>Partner (supplier)</th><th>Dest.</th><th class="n">PO value</th><th class="n">Deposit paid</th><th class="n">Balance paid</th><th class="n">Other paid</th><th class="n">Request amount (USD)</th><th>Tracker status</th></tr>'+rows.map(p=>'<tr><td>'+p.po+(p.notInSql?' <span class="tag w">not in SQL</span>':'')+'</td><td>'+esc(p.supplier)+'</td><td>'+esc(p.dest)+'</td><td class="n">'+f(p.value)+'</td><td class="n">'+f(p.depPaid)+'</td><td class="n">'+f(p.balPaid)+'</td><td class="n">'+f(p.otherPaid)+'</td><td class="n"><b>'+f(p.totPaid)+'</b></td><td>'+esc(p.pstatus)+'</td></tr>').join('')+'<tr class="sub"><td colspan="7">'+rows.length+' requests</td><td class="n">'+f(tot)+'</td><td></td></tr></table>'}
function expView(){const rows=D.exp.filter(e=>(!$('#fs').value||e.pos.some(po=>D.pos.find(p=>p.po==po).supplier==$('#fs').value))&&(!$('#fd').value||e.dest==$('#fd').value)&&(!q()||(e.vendor+' '+e.invoice+' '+e.container+' '+e.pos.join(' ')+' '+e.lines.map(x=>x.expense).join(' ')).toLowerCase().includes(q())));const t={};rows.forEach(e=>t[e.cur]=(t[e.cur]||0)+e.total);
return '<div class="mut" style="margin-bottom:6px">'+rows.length+' requests · '+cur(t)+'</div>'+rows.map(e=>'<div class="ct"><h4>'+esc(e.vendor)+' · Invoice '+esc(e.invoice)+'<span class="tag">'+e.date+'</span><span class="tag">'+e.cur+'</span><span class="tag">'+esc(e.dest)+'</span><span class="tot" style="margin-left:auto">'+f(e.total)+' '+e.cur+'</span></h4><div class="mut">Container '+e.container+' ('+esc(e.cstatus)+') · POs on container: '+esc(e.pos.join(', '))+'</div><table><tr><th>Expense (cost center)</th><th class="n">Amount</th></tr>'+e.lines.map(x=>'<tr><td>'+esc(x.expense)+'</td><td class="n">'+f(x.amount)+'</td></tr>').join('')+'</table>'+(e.paid.length?'<div class="mut" style="margin-top:6px">Paid for container (J–N): '+e.paid.map(x=>x.date+' '+esc(x.vendor)+' '+f(x.amount)+' '+x.cur).join(' · ')+'</div>':'<div class="mut" style="margin-top:6px">No payment recorded for this container yet.</div>')+'</div>').join('')}
const q=()=>$('#q').value.toLowerCase().trim();
const match=p=>{const s=$('#fs').value,d=$('#fd').value;return !(s&&p.supplier!=s)&&!(d&&p.dest!=d)&&(!q()||p.h.includes(q()))};
function render(){const vw=$('#vw').value;$('#howto').innerHTML='<b>How to read:</b> '+HOW[vw];$('#fp').style.display=vw=='po'?'':'none';$('#ex').style.display=$('#co').style.display=vw=='po'?'':'none';
if(vw=='req'){$('#list').innerHTML=reqView();$('#sum').textContent='';return}
if(vw=='exp'){$('#list').innerHTML=expView();$('#sum').textContent='';$('#other').innerHTML='';return}
const qq=q(),s=$('#fs').value,d=$('#fd').value,fp=$('#fp').value;const out=[];
D.pos.forEach(p=>{if(s&&p.supplier!=s)return;if(d&&p.dest!=d)return;if(qq&&!p.h.includes(qq))return;
if(fp=='pp'&&!(p.totPaid>0))return;if(fp=='np'&&p.totPaid>0)return;if(fp=='i'&&!hasI(p))return;if(fp=='p'&&!hasP(p))return;if(fp=='u'&&!(hasI(p)&&!hasP(p)))return;if(fp=='o'&&!(p.totRem<-0.005))return;if(fp=='s'&&!p.pls.some(l=>l.shared.length))return;if(fp=='x'&&!p.notInSql)return;out.push(card(p))});
$('#list').innerHTML=out.join('')||'<div class="empty">No POs match.</div>';$('#sum').textContent=out.length+' of '+D.pos.length+' POs shown';
$('#other').innerHTML=D.sheetOnly.length&&!qq&&!s&&!d&&!fp?'<div class="note"><b>'+D.sheetOnly.length+' POs are in the PO Payments tab but not in your SQL</b> (not shown below): '+D.sheetOnly.map(x=>x.po+' ('+f(x.totPaid)+' paid)').join(', ')+'</div>':''}
['q','fs','fd','fp','vw'].forEach(i=>$('#'+i).addEventListener('input',render));
$('#list').addEventListener('click',e=>{const h=e.target.closest('.ph');if(h)h.parentNode.classList.toggle('open')});
$('#ex').onclick=()=>document.querySelectorAll('.po').forEach(x=>x.classList.add('open'));$('#co').onclick=()=>document.querySelectorAll('.po').forEach(x=>x.classList.remove('open'));
render();
</script></body></html>
